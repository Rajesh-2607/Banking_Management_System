{% extends "base.html" %}
{% block content %}
<h4>Request a New Account</h4>
<form method="POST">
  <div class="mb-3">
    <label>Full Name</label>
    <input name="full_name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>Email</label>
    <input name="email" type="email" class="form-control" required>
  </div>
  <button class="btn btn-success">Send Request</button>
</form>
{% endblock %}
